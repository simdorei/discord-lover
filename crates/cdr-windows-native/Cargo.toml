[package]
name = "cdr-windows-native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
png = "0.18.0"
thiserror.workspace = true
tokio = {workspace=true,features=["net"]}
windows-sys = { workspace = true, features = ["Win32_System_Registry", "Win32_Security_Authorization", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops"] }

[dev-dependencies]
tempfile.workspace = true
uuid.workspace = true

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
undocumented_unsafe_blocks = "deny"
